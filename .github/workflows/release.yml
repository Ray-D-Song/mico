name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -ldflags="-s -w" -o "mico_${GOOS}_${GOARCH}${ext}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mico_${{ matrix.goos }}_${{ matrix.goarch }}
          path: mico_${{ matrix.goos }}_${{ matrix.goarch }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mico_*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum mico_* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mico_*
            checksums.txt
          generate_release_notes: true

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DARWIN_AMD64_SHA=$(grep 'mico_darwin_amd64' checksums.txt | awk '{print $1}')
          DARWIN_ARM64_SHA=$(grep 'mico_darwin_arm64' checksums.txt | awk '{print $1}')
          LINUX_AMD64_SHA=$(grep 'mico_linux_amd64' checksums.txt | awk '{print $1}')
          LINUX_ARM64_SHA=$(grep 'mico_linux_arm64' checksums.txt | awk '{print $1}')

          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Ray-D-Song/homebrew-mico.git /tmp/homebrew-mico

          FORMULA="/tmp/homebrew-mico/Formula/mico.rb"
          sed -i "s|version \".*\"|version \"${VERSION}\"|" "$FORMULA"
          sed -i "s|https://github.com/Ray-D-Song/mico/releases/download/v[^/]*|https://github.com/Ray-D-Song/mico/releases/download/v${VERSION}|g" "$FORMULA"
          sed -i "/mico_darwin_amd64/{n;s|sha256 \".*\"|sha256 \"${DARWIN_AMD64_SHA}\"|}" "$FORMULA"
          sed -i "/mico_darwin_arm64/{n;s|sha256 \".*\"|sha256 \"${DARWIN_ARM64_SHA}\"|}" "$FORMULA"
          sed -i "/mico_linux_amd64/{n;s|sha256 \".*\"|sha256 \"${LINUX_AMD64_SHA}\"|}" "$FORMULA"
          sed -i "/mico_linux_arm64/{n;s|sha256 \".*\"|sha256 \"${LINUX_ARM64_SHA}\"|}" "$FORMULA"

          cd /tmp/homebrew-mico
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update mico to v${VERSION}"
          git push
